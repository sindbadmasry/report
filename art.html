<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام 2M ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Cairo', sans-serif; 
      background-color: #f8fafc; 
      margin: 0; 
      padding: 0; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }

    /* إصلاح تداخل المحتوى مع شريط التنقل */
    .main-container {
      flex: 1; /* يأخذ كل المساحة المتاحة ما عدا الهيدر والناف بار */
      overflow-y: auto; /* يسمح بالتمرير داخل المحتوى فقط */
      padding: 1rem;
      padding-bottom: 20px; /* مسافة إضافية في النهاية */
    }

    /* شريط التنقل السفلي الثابت */
    .bottom-nav {
      height: 70px;
      background: white;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-shrink: 0; /* يمنع انكماش الشريط */
      z-index: 50;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #94a3b8;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    .nav-item.active { color: #2563eb; }
    .nav-item i { font-size: 1.25rem; margin-bottom: 4px; }

    .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 1rem; margin-bottom: 1rem; }
    .input-field { width: 100%; border: 1px solid #e2e8f0; border-radius: 0.75rem; padding: 0.75rem; margin-top: 0.5rem; outline: none; }
    .input-field:focus { border-color: #2563eb; ring: 2px ring-blue-100; }

    .btn-primary { background: #2563eb; color: white; padding: 0.75rem; border-radius: 0.75rem; font-weight: 700; width: 100%; }
    .btn-secondary { background: #f1f5f9; color: #475569; padding: 0.5rem; border-radius: 0.5rem; font-size: 0.8rem; }

    /* Modal Styling */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; z-index: 100; backdrop-filter: blur(4px); }
    .modal.active { display: flex; }
    .modal-content { background: white; width: 100%; border-radius: 1.5rem 1.5rem 0 0; padding: 1.5rem; max-height: 90%; overflow-y: auto; }
    
    .status-badge { padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.7rem; font-weight: 700; }
    .status-paid { background: #dcfce7; color: #166534; }
    .status-unpaid { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <header class="bg-white px-5 py-4 flex justify-between items-center border-b flex-shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white"><i class="fa-solid fa-file-invoice-dollar"></i></div>
      <h1 class="font-black text-slate-800">2M ERP</h1>
    </div>
    <div id="user-info" class="text-left">
       <button onclick="app.logout()" class="text-rose-500 text-sm font-bold"><i class="fa-solid fa-power-off"></i></button>
    </div>
  </header>

  <div id="login-screen" class="main-container flex items-center justify-center">
    <div class="card w-full max-w-sm">
      <h2 class="text-2xl font-black text-center mb-6">تسجيل الدخول</h2>
      <input type="text" id="username" class="input-field" placeholder="اسم المستخدم">
      <input type="password" id="password" class="input-field mt-4" placeholder="كلمة المرور">
      <button onclick="app.login()" class="btn-primary mt-6">دخول</button>
    </div>
  </div>

  <div id="main-screen" class="main-container hidden">
    
    <div id="tab-home" class="tab-content">
      <div class="flex gap-2 mb-4">
        <button onclick="app.setTransType('revenue')" id="btn-rev" class="flex-1 py-3 rounded-xl font-bold bg-blue-600 text-white">إيراد</button>
        <button onclick="app.setTransType('expense')" id="btn-exp" class="flex-1 py-3 rounded-xl font-bold bg-slate-200 text-slate-600">مصروف</button>
      </div>

      <div class="card">
        <form id="trans-form" onsubmit="event.preventDefault(); app.saveTransaction();">
          <div id="student-select-group">
            <label class="text-sm font-bold">الطالب</label>
            <select id="trans-student" class="input-field"></select>
          </div>
          <div class="mt-4">
            <label class="text-sm font-bold">البند</label>
            <select id="trans-category" class="input-field"></select>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-4">
            <div>
              <label class="text-sm font-bold">المبلغ</label>
              <input type="number" id="trans-amount" class="input-field" required>
            </div>
            <div>
              <label class="text-sm font-bold">التاريخ</label>
              <input type="date" id="trans-date" class="input-field" required>
            </div>
          </div>
          <div class="mt-4">
            <label class="text-sm font-bold">المستلم / المنفذ</label>
            <input type="text" id="trans-recipient" class="input-field" required>
          </div>
          <button type="submit" class="btn-primary mt-6">حفظ المعاملة</button>
        </form>
      </div>
    </div>

    <div id="tab-reports" class="tab-content hidden">
      <div class="flex gap-2 overflow-x-auto pb-2 mb-4 no-scrollbar">
        <button onclick="app.showReport('students')" class="btn-secondary whitespace-nowrap bg-blue-100 text-blue-700 font-bold">موقف الطلاب</button>
        <button onclick="app.showReport('expenses')" class="btn-secondary whitespace-nowrap">المصروفات</button>
        <button onclick="app.showReport('recipients')" class="btn-secondary whitespace-nowrap">المستلمين</button>
      </div>

      <div id="report-filter-area" class="mb-4">
        </div>

      <div id="report-list" class="space-y-3">
        </div>
    </div>

    <div id="tab-settings" class="tab-content hidden">
      <div id="admin-section" class="hidden">
        <h3 class="font-black mb-3">إدارة المستخدمين</h3>
        <button onclick="app.openUserModal()" class="btn-primary mb-4 bg-slate-800"><i class="fa-solid fa-plus"></i> إضافة مستخدم</button>
        <div id="users-list" class="space-y-2"></div>
        <hr class="my-6">
      </div>
      
      <h3 class="font-black mb-3">إدارة الطلاب</h3>
      <button onclick="app.openStudentModal()" class="btn-primary mb-4"><i class="fa-solid fa-user-plus"></i> إضافة طالب جديد</button>
      <div id="students-list" class="space-y-2"></div>
    </div>

  </div>

  <nav id="bottom-nav" class="bottom-nav hidden">
    <div class="nav-item active" onclick="app.switchTab('home', this)"><i class="fa-solid fa-house"></i><span>الرئيسية</span></div>
    <div class="nav-item" onclick="app.switchTab('reports', this)"><i class="fa-solid fa-chart-line"></i><span>التقارير</span></div>
    <div class="nav-item" onclick="app.switchTab('settings', this)"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></div>
  </nav>

  <div id="modal" class="modal" onclick="if(event.target === this) app.closeModal()">
    <div class="modal-content" id="modal-body"></div>
  </div>

  <script>
    const API = "REPLACE_WITH_YOUR_WEB_APP_URL"; // سيتم التعامل معه داخلياً في GAS

    const app = {
      data: { users: [], students: [], categories: [], transactions: [] },
      user: null,
      transType: 'revenue',

      async init() {
        const cachedUser = localStorage.getItem('erp_user');
        if (cachedUser) {
          this.user = JSON.parse(cachedUser);
          this.showMain();
          await this.loadData();
        }
      },

      async loadData() {
        google.script.run.withSuccessHandler(res => {
          if (res.status === 'success') {
            this.data = res.data;
            this.renderAll();
          }
        }).doPost({ action: 'GET_DATA' });
      },

      login() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        google.script.run.withSuccessHandler(res => {
          const found = res.data.users.find(x => x.username === u && x.password == p);
          if (found) {
            this.user = found;
            localStorage.setItem('erp_user', JSON.stringify(found));
            this.data = res.data;
            this.showMain();
            this.renderAll();
          } else {
            alert('خطأ في البيانات');
          }
        }).doPost({ action: 'GET_DATA' });
      },

      logout() {
        localStorage.removeItem('erp_user');
        location.reload();
      },

      showMain() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        document.getElementById('bottom-nav').classList.remove('hidden');
        if (this.user.role === 'مدير') {
          document.getElementById('admin-section').classList.remove('hidden');
        }
        document.getElementById('trans-recipient').value = this.user.username;
        document.getElementById('trans-date').valueAsDate = new Date();
      },

      switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        if(tabId === 'reports') this.showReport('students');
      },

      setTransType(type) {
        this.transType = type;
        const isRev = type === 'revenue';
        document.getElementById('btn-rev').className = isRev ? "flex-1 py-3 rounded-xl font-bold bg-blue-600 text-white" : "flex-1 py-3 rounded-xl font-bold bg-slate-200 text-slate-600";
        document.getElementById('btn-exp').className = !isRev ? "flex-1 py-3 rounded-xl font-bold bg-red-600 text-white" : "flex-1 py-3 rounded-xl font-bold bg-slate-200 text-slate-600";
        document.getElementById('student-select-group').style.display = isRev ? 'block' : 'none';
        this.renderCategories();
      },

      renderAll() {
        this.renderCategories();
        this.renderStudentsSelect();
        this.renderStudentsSettings();
        this.renderUsersSettings();
      },

      renderCategories() {
        const sel = document.getElementById('trans-category');
        sel.innerHTML = this.data.categories
          .filter(c => c.type === this.transType)
          .map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      },

      renderStudentsSelect() {
        const sel = document.getElementById('trans-student');
        sel.innerHTML = this.data.students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      },

      async saveTransaction() {
        const payload = {
          type: this.transType,
          categoryId: document.getElementById('trans-category').value,
          studentId: this.transType === 'revenue' ? document.getElementById('trans-student').value : "",
          amount: document.getElementById('trans-amount').value,
          date: document.getElementById('trans-date').value,
          recipient: document.getElementById('trans-recipient').value,
          userId: this.user.id,
          timestamp: new Date().toISOString()
        };

        google.script.run.withSuccessHandler(() => {
          alert('تم الحفظ');
          document.getElementById('trans-form').reset();
          this.loadData();
        }).doPost({ action: 'SAVE_TRANSACTION', payload });
      },

      // --- التقارير ---
      showReport(type) {
        const container = document.getElementById('report-list');
        const filterArea = document.getElementById('report-filter-area');
        filterArea.innerHTML = "";
        container.innerHTML = "جاري التحميل...";

        if (type === 'students') {
          filterArea.innerHTML = `
            <select onchange="app.filterStudentsReport(this.value)" class="input-field">
              <option value="all">الكل</option>
              <option value="paid">المسددين بالكامل</option>
              <option value="unpaid">المتأخرين</option>
            </select>`;
          this.filterStudentsReport('all');
        } 
        else if (type === 'expenses') {
          const summary = {};
          this.data.transactions.filter(t => t.type === 'expense').forEach(t => {
            const catName = this.data.categories.find(c => c.id == t.categoryId)?.name || "أخرى";
            summary[catName] = (summary[catName] || 0) + parseFloat(t.amount);
          });
          container.innerHTML = Object.keys(summary).map(cat => `
            <div class="card flex justify-between items-center" onclick="app.showDetailCard('expense', '${cat}')">
              <span class="font-bold">${cat}</span>
              <span class="text-rose-600 font-black">${summary[cat]} ج.م</span>
            </div>`).join('');
        }
        else if (type === 'recipients') {
          const summary = {};
          this.data.transactions.forEach(t => {
            summary[t.recipient] = (summary[t.recipient] || 0) + parseFloat(t.amount);
          });
          container.innerHTML = Object.keys(summary).map(rec => `
            <div class="card flex justify-between items-center" onclick="app.showDetailCard('recipient', '${rec}')">
              <span class="font-bold">${rec}</span>
              <span class="text-blue-600 font-black">${summary[rec]} ج.م</span>
            </div>`).join('');
        }
      },

      filterStudentsReport(filter) {
        const container = document.getElementById('report-list');
        let html = this.data.students.map(s => {
          const payments = this.data.transactions.filter(t => t.studentId == s.id && t.type === 'revenue');
          const totalPaid = payments.reduce((sum, t) => sum + parseFloat(t.amount), 0);
          
          // حساب الشهور المستحقة
          const start = new Date(s.start_date);
          const now = new Date();
          const months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth()) + 1;
          const totalRequired = months * parseFloat(s.subscription);
          const balance = totalRequired - totalPaid;

          if (filter === 'paid' && balance > 0) return '';
          if (filter === 'unpaid' && balance <= 0) return '';

          return `
            <div class="card" onclick="app.showStudentHistory('${s.id}')">
              <div class="flex justify-between items-start">
                <div>
                  <h4 class="font-black">${s.name}</h4>
                  <p class="text-xs text-slate-500">مطلوب: ${totalRequired} | مدفوع: ${totalPaid}</p>
                </div>
                <span class="status-badge ${balance <= 0 ? 'status-paid' : 'status-unpaid'}">
                  ${balance <= 0 ? 'مسدد' : 'متأخر: ' + balance}
                </span>
              </div>
            </div>`;
        }).join('');
        container.innerHTML = html || "لا يوجد بيانات";
      },

      // --- كروت التفاصيل ---
      showStudentHistory(id) {
        const s = this.data.students.find(x => x.id == id);
        const txs = this.data.transactions.filter(t => t.studentId == id).sort((a,b) => new Date(b.date) - new Date(a.date));
        
        let html = `
          <h2 class="text-xl font-black mb-4">${s.name}</h2>
          <div class="space-y-2">
            ${txs.map(t => `
              <div class="flex justify-between border-b py-2 text-sm">
                <span>${t.date}</span>
                <span class="font-bold text-green-600">${t.amount} ج.م</span>
              </div>
            `).join('')}
          </div>
          <button onclick="app.closeModal()" class="btn-primary mt-6 bg-slate-200 text-slate-800">إغلاق</button>
        `;
        this.openModal(html);
      },

      showDetailCard(type, key) {
        const txs = this.data.transactions.filter(t => {
          if(type === 'expense') return t.type === 'expense' && (this.data.categories.find(c=>c.id==t.categoryId)?.name === key);
          return t.recipient === key;
        });

        let html = `
          <h2 class="text-xl font-black mb-4">${key}</h2>
          <div class="space-y-2">
            ${txs.map(t => `
              <div class="flex justify-between border-b py-2 text-sm">
                <span>${t.date} (${t.recipient})</span>
                <span class="font-bold">${t.amount} ج.م</span>
              </div>
            `).join('')}
          </div>
          <button onclick="app.closeModal()" class="btn-primary mt-6 bg-slate-200 text-slate-800">إغلاق</button>
        `;
        this.openModal(html);
      },

      // --- الإعدادات (CRUD) ---
      renderStudentsSettings() {
        document.getElementById('students-list').innerHTML = this.data.students.map(s => `
          <div class="card flex justify-between items-center py-2">
            <span>${s.name}</span>
            <div class="flex gap-2">
              <button onclick="app.openStudentModal('${s.id}')" class="text-blue-500"><i class="fa-solid fa-pen"></i></button>
              <button onclick="app.deleteRecord('Students', '${s.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>`).join('');
      },

      renderUsersSettings() {
        document.getElementById('users-list').innerHTML = this.data.users.map(u => `
          <div class="card flex justify-between items-center py-2">
            <span>${u.username} (${u.role})</span>
            <div class="flex gap-2">
              <button onclick="app.deleteRecord('Users', '${u.id}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>`).join('');
      },

      openStudentModal(id = null) {
        const s = id ? this.data.students.find(x => x.id == id) : { id: '', name: '', phone: '', subscription: '', start_date: '' };
        let html = `
          <h2 class="font-black mb-4">${id ? 'تعديل طالب' : 'إضافة طالب'}</h2>
          <input type="hidden" id="edit-s-id" value="${s.id}">
          <input type="text" id="edit-s-name" class="input-field" placeholder="الاسم" value="${s.name}">
          <input type="number" id="edit-s-sub" class="input-field mt-2" placeholder="الاشتراك الشهري" value="${s.subscription}">
          <input type="date" id="edit-s-date" class="input-field mt-2" value="${s.start_date}">
          <button onclick="app.saveStudent()" class="btn-primary mt-4">حفظ</button>
        `;
        this.openModal(html);
      },

      async saveStudent() {
        const payload = {
          id: document.getElementById('edit-s-id').value || Date.now(),
          name: document.getElementById('edit-s-name').value,
          subscription: document.getElementById('edit-s-sub').value,
          start_date: document.getElementById('edit-s-date').value,
          status: 'نشط'
        };
        google.script.run.withSuccessHandler(() => { this.closeModal(); this.loadData(); }).doPost({ action: 'SAVE_STUDENT', payload });
      },

      openUserModal() {
        let html = `
          <h2 class="font-black mb-4">إضافة مستخدم</h2>
          <input type="text" id="new-u-name" class="input-field" placeholder="اسم المستخدم">
          <input type="password" id="new-u-pass" class="input-field mt-2" placeholder="كلمة المرور">
          <select id="new-u-role" class="input-field mt-2">
            <option value="محاسب">محاسب</option>
            <option value="مدير">مدير</option>
          </select>
          <button onclick="app.saveUser()" class="btn-primary mt-4">حفظ</button>
        `;
        this.openModal(html);
      },

      async saveUser() {
        const payload = {
          id: Date.now(),
          username: document.getElementById('new-u-name').value,
          password: document.getElementById('new-u-pass').value,
          role: document.getElementById('new-u-role').value
        };
        google.script.run.withSuccessHandler(() => { this.closeModal(); this.loadData(); }).doPost({ action: 'SAVE_USER', payload });
      },

      async deleteRecord(sheet, id) {
        if(!confirm('هل أنت متأكد؟')) return;
        google.script.run.withSuccessHandler(() => this.loadData()).doPost({ action: 'DELETE_RECORD', payload: { sheet, id } });
      },

      openModal(html) {
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('modal').classList.add('active');
      },

      closeModal() {
        document.getElementById('modal').classList.remove('active');
      }
    };

    window.onload = () => app.init();
  </script>
</body>
</html>
